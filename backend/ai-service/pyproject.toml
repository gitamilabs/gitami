[project]
name = "ai-service"
version = "0.1.0"
description = "Knowledge Base & PR Evaluation Service for Code Review"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.5.9",
    "google-generativeai>=0.8.6",
    "tree-sitter>=0.22.0",
    "tree-sitter-python>=0.21.0",
    "tree-sitter-javascript>=0.21.0",
    "tree-sitter-typescript>=0.21.0",
    "neo4j>=5.18.0",
    "pydantic-settings>=2.2.0",
    "gitpython>=3.1.40",
    "click>=8.1.0",
    "mcp[cli]>=1.0.0",
    "google-genai>=0.1.0",
    "groq>=0.9.0",
    "unidiff>=0.7.5",
    "fastmcp>=3.4.6",
    "fastapi>=0.141.1",
    "openai>=1.30.0",
    "fastembed>=0.3.0",
    "qdrant-client>=1.9.0",
    "pinecone>=3.0.0",
    "supabase>=2.0.0",
]

[project.scripts]
ai-service = "ai_service.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_service"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.vercel]
entrypoint = "src.ai_service.web.app:app"