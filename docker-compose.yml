services:
  neo4j:
    image: neo4j:5-community
    container_name: gitami-neo4j
    ports:
      - "7474:7474" # HTTP Browser
      - "7687:7687" # Bolt protocol
    environment:
      - NEO4J_AUTH=neo4j/gitamipassword
      - NEO4J_PLUGINS=["apoc"]
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs

  postgres:
    image: postgres:16-alpine
    container_name: gitami-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=gitami
      - POSTGRES_PASSWORD=gitamipassword
      - POSTGRES_DB=gitami
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  neo4j_data:
  neo4j_logs:
  postgres_data:
