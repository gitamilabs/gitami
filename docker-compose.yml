services:
  joern:
    image: ghcr.io/joernio/joern:master
    container_name: gitami-joern
    ports:
      - "8088:8088"  # Joern CPGQL Server HTTP/REST & WebSocket
    volumes:
      - ./chroma_db/repos:/workspace
    entrypoint: ["joern", "--server", "--server-host", "0.0.0.0", "--server-port", "8088"]
    restart: unless-stopped
